AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static copy of www.thebridgeto.ai served at v2.thebridgeto.ai. A private S3 bucket
  behind CloudFront (origin access control), a CloudFront Function that maps the live
  site's URL forms onto index.html objects, security headers, access logs, an ACM
  certificate validated through the existing Route53 zone, and alias records.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Domain }
        Parameters: [SiteHostname, HostedZoneId]
      - Label: { default: API proxy }
        Parameters: [ApiOriginDomain, ApiOriginBasePath]
      - Label: { default: Housekeeping }
        Parameters: [ResourcePrefix, LogRetentionDays]

Parameters:
  SiteHostname:
    Type: String
    Default: v2.thebridgeto.ai
    Description: Hostname the copy is served from. Must live in HostedZoneId.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$'
  HostedZoneId:
    Type: String
    Default: Z00041362HB0V7RN0S0GA
    Description: Existing Route53 hosted zone for thebridgeto.ai (certificate validation and alias records).
  ApiOriginDomain:
    Type: String
    Default: n8n.thebridgeto.ai
    Description: >-
      Host that answers /rest/* requests (the n8n instance). It must present a valid public
      certificate; CloudFront connects to it over HTTPS only.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$'
  ApiOriginBasePath:
    Type: String
    Default: /webhook
    Description: >-
      Path prefix on ApiOriginDomain that replaces the /rest prefix, so /rest/btai/subscribe/
      is fetched from <ApiOriginDomain><ApiOriginBasePath>/btai/subscribe/. New endpoints need
      no stack change; register the webhook under this prefix and call it under /rest/.
    AllowedPattern: '^/[A-Za-z0-9._~/-]*[A-Za-z0-9._~-]$'
  ResourcePrefix:
    Type: String
    Default: thebridgetoai-v2
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    Description: Prefix for resources that need account-unique names.
  LogRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to keep CloudFront access logs.

Resources:
  # ---------------------------------------------------------------- Buckets
  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'us-east-1.logs.${SiteHostname}'
      OwnershipControls:
        Rules:
          # CloudFront standard logging writes with a bucket ACL, so ACLs stay enabled here.
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'us-east-1.${SiteHostname}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # No ListBucket on purpose: S3 then answers a missing object with 403, which is the
          # only status mapped to the static 404 page below, so 404s from the API origin
          # (for example n8n's "webhook not registered" JSON) reach the browser unchanged.

  # ---------------------------------------------------------------- CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ResourcePrefix}-site-oac'
        Description: Signs CloudFront requests to the v2.thebridgeto.ai site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ResourcePrefix}-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: Maps the live site's URL forms onto index.html objects (see static-site/build.py)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        // v2.thebridgeto.ai - viewer-request function.
        // The Java site behind www.thebridgeto.ai serves the same page for /about and /about/,
        // and ignores the slug after a content UUID. build.py stores one index.html per page
        // and this function maps every request form onto it:
        //   /                              -> /index.html
        //   /about  or  /about/            -> /about/index.html
        //   /section/<uuid>/<any-slug>     -> /section/<uuid>/index.html
        //   /<uuid>                        -> unchanged (an image copied from cdn.thebridgeto.ai; no extension)
        //   /path/file.ext                 -> unchanged
        var UUID = '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}';
        var ROOT_ASSET = new RegExp('^/' + UUID + '$');
        var CONTENT_PAGE = new RegExp('^(/[^/]+(?:/[^/]+)*?/' + UUID + ')(?:/.*)?$');
        var FILE = /\.(?:html?|css|js|mjs|map|json|xml|txt|ico|png|jpe?g|gif|svg|webp|avif|mp3|mp4|m4a|wav|ogg|webm|pdf|woff2?|ttf|otf|eot|webmanifest|zip|csv|md|ics|vcf)$/i;

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (ROOT_ASSET.test(uri)) {
            return request;
          }
          var page = CONTENT_PAGE.exec(uri);
          if (page) {
            request.uri = page[1] + '/index.html';
            return request;
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }
          if (FILE.test(uri)) {
            return request;
          }
          request.uri = uri + '/index.html';
          return request;
        }

  RestProxyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ResourcePrefix}-rest-proxy'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrites /rest/<path> to the API origin's base path before the request leaves CloudFront
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        // v2.thebridgeto.ai - /rest/* viewer-request function.
        // The /rest/* cache behavior sends requests to ${ApiOriginDomain}. This swaps the /rest
        // prefix for the origin's base path and leaves everything else (trailing slash, query
        // string, method, headers, body) exactly as the browser sent it:
        //   /rest/btai/subscribe/  ->  ${ApiOriginBasePath}/btai/subscribe/
        function handler(event) {
          var request = event.request;
          request.uri = '${ApiOriginBasePath}' + request.uri.substring('/rest'.length);
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ResourcePrefix}-security-headers'
        Comment: The hardening headers the Java site sends, plus HSTS, plus the CDN's open CORS.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: false
            Override: true
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ['*']
          AccessControlAllowMethods:
            Items: [GET, HEAD]
          AccessControlAllowOrigins:
            Items: ['*']
          OriginOverride: false

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SiteHostname
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SiteHostname
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Static copy of www.thebridgeto.ai (${SiteHostname})'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: [!Ref SiteHostname]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api-origin
            DomainName: !Ref ApiOriginDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed CachingOptimized (ignores query strings)
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
        # /rest/* is a pass-through proxy to the API origin: nothing is cached, every method and
        # every header except Host is forwarded, and the response comes back unmodified (except
        # that a 403 from the API origin is also replaced by the distribution-wide error page).
        CacheBehaviors:
          - PathPattern: '/rest/*'
            TargetOriginId: api-origin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # AWS managed CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AWS managed AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RestProxyFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        Logging:
          Bucket: !GetAtt LogsBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Comment: !Sub '${SiteHostname} to CloudFront'
      RecordSets:
        - Name: !Ref SiteHostname
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's fixed hosted zone ID
            EvaluateTargetHealth: false
        - Name: !Ref SiteHostname
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

Outputs:
  SiteURL:
    Value: !Sub 'https://${SiteHostname}'
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteBucketName:
    Value: !Ref SiteBucket
  LogsBucketName:
    Value: !Ref LogsBucket
  CertificateArn:
    Value: !Ref Certificate
  ApiProxy:
    Description: Where /rest/<path> requests are sent
    Value: !Sub 'https://${ApiOriginDomain}${ApiOriginBasePath}/<path>'
